name: tests
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            challenge/prototype/requirements.txt
            challenge/app/requirements.txt
            challenge/app/requirements-dev.txt
      - run: pip install -r challenge/app/requirements-dev.txt
      - run: playwright install --with-deps chromium
      # No database, key, or raw/ in CI: the pages render from committed data and the agent is faked in test_e2e.py.
      - run: python -m pytest challenge/app -q
