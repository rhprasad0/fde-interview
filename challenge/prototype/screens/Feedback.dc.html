<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tell us what you think</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f5f7;font-family:'Public Sans',system-ui,sans-serif;color:#1b1b1b}
a{color:#005ea2}a:hover{color:#1a4480}
button,textarea{font-family:inherit}
</style>
</head>
<body>
<div style="min-height: 100vh; display: flex; flex-direction: column">

  <header style="background: #ffffff; border-bottom: 1px solid #dfe1e5">
    <div style="max-width: 1120px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
      <div style="display: flex; align-items: center; gap: 10px">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#005ea2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M5 21V8l7-5 7 5v13"></path><path d="M9 21v-6h6v6"></path></svg>
        <span style="font-weight: 700; font-size: 17px">Quarterly Staffing Review</span>
        <span style="color: #4b4f58; font-size: 15px">Department of Homeland Security</span>
      </div>
      <div style="margin-left: auto; font-size: 13px; color: #4b4f58">
        <a href="/" style="font-weight: 600; text-decoration: none; padding: 10px 14px; border: 1px solid #005ea2; border-radius: 4px; min-height: 44px; display: inline-flex; align-items: center">Back to the brief</a>
      </div>
    </div>
  </header>

  <main style="max-width: 1120px; width: 100%; margin: 0 auto; padding: 32px 24px 48px; box-sizing: border-box">
    <form id="feedback" style="background: #ffffff; border: 1px solid #dfe1e5; border-radius: 6px; padding: 28px; display: flex; flex-direction: column; gap: 22px; max-width: 820px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 700">Tell us what you think</h1>
        <p style="margin: 0; font-size: 15px; color: #4b4f58">Five questions. Write as much or as little as you like; nothing here is required.</p>
      </div>
      <div data-q style="display: flex; flex-direction: column; gap: 22px"></div>
      <div style="display: flex; align-items: center; gap: 14px">
        <button type="submit" style="min-height: 44px; padding: 0 20px; border-radius: 4px; border: 1px solid #005ea2; background: #005ea2; color: #ffffff; font-weight: 600; font-size: 15px; cursor: pointer">Submit</button>
        <span id="status" role="status" style="font-size: 15px; font-weight: 600; color: #2e8540"></span>
      </div>
    </form>
  </main>
</div>
<script>
(() => {
  const QUESTIONS = [
    'What did you trust least, and why?',
    'What did you want to see first?',
    'What would your director ask that this did not answer?',
    'If we showed this to a panel of engineers in fifteen minutes, what should we show first and what should we leave out?',
    'Anything else?',
  ];
  const host = document.querySelector('[data-q]'), status = document.getElementById('status');
  host.innerHTML = QUESTIONS.map((q, i) => `<div style="display: flex; flex-direction: column; gap: 8px">
    <label for="fb${i}" style="font-size: 16px; font-weight: 600; line-height: 1.4">${i + 1}. ${q}</label>
    <textarea id="fb${i}" rows="4" style="font-size: 15px; line-height: 1.5; padding: 10px 14px; border: 1px solid #565c65; border-radius: 4px; resize: vertical"></textarea></div>`).join('');
  const boxes = QUESTIONS.map((_, i) => document.getElementById('fb' + i));
  fetch('/api/feedback').then(r => r.json()).then(a => boxes.forEach((b, i) => { if (!b.value) b.value = a[QUESTIONS[i]] || ''; }));
  boxes.forEach(b => b.addEventListener('input', () => { status.textContent = ''; }));
  document.getElementById('feedback').addEventListener('submit', async e => {
    e.preventDefault();
    const answers = Object.fromEntries(QUESTIONS.map((q, i) => [q, boxes[i].value]));
    const r = await fetch('/api/feedback', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({answers})});
    status.textContent = r.ok ? 'Thank you, saved' : 'Not saved, please try again';
  });
})();
</script>
</body>
</html>
