- id: C17
  author: ryan_claude
  seed: [A07]
  reason: false_limit
  verbatim: Are higher-graded CBP Officers leaving at a higher rate than lower grades?
  class: exploratory
  expected_behavior: list
  tier: genie
  expected_tools: [genie]
  tolerance: abs:0.001
  truth_sql: |
    WITH hc AS (SELECT CASE WHEN grade ~ '^\d+$' THEN grade::int END AS g, count(*) FILTER (WHERE snapshot_month = DATE'2025-09-01') AS s,
    count(*) FILTER (WHERE snapshot_month = DATE'2026-08-01') AS e
    FROM workforce.synthetic.employment WHERE snapshot_month IN (DATE'2025-09-01', DATE'2026-08-01') AND agency_subelement_code = 'HSBD' AND occupational_series_code = '1895' GROUP BY 1),
    sp AS (SELECT CASE WHEN grade ~ '^\d+$' THEN grade::int END AS g, count(*) AS t FROM workforce.synthetic.separations WHERE effective_month BETWEEN DATE'2025-09-01' AND DATE'2026-08-01' AND agency_subelement_code = 'HSBD' AND occupational_series_code = '1895' GROUP BY 1)
    SELECT hc.g::text AS key, round(coalesce(sp.t, 0)::numeric / ((hc.s + hc.e) / 2.0), 4) AS value
    FROM hc LEFT JOIN sp USING (g) WHERE hc.e >= 100 ORDER BY hc.g
  key_by: grade
  notes: In the tester session the agent said there is no grade field for staff; grade is on the workforce, separation, and accession views. Not available fails as false_not_available.

