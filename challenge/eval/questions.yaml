# ---- Held out: Tester A (8), added 2026-11-03 after the eval-v1 tag ----
# Verbatim from the 2026-11-01 session trace, in session order; never shown to prompt development.
# Related, not independent: C01 and C18 were seeded from A01, C17 from A07, C09 and C03 from A08, and
# the OPM-paragraph skill (05) was written for the ask in A03. Truth values were pinned before the first run.

- id: A01
  author: tester_a
  session_log: challenge/eval/sessions/2026-11-01-tester-a/trace.jsonl
  verbatim: "As the Human Capital analyst I need more data on retirement eligibility numbers for next several years and would like it broken down by occupation. Would also like it to be systemtically aligned to the hiring pipeline by occupation and organization hierarchy (Groups/Divisions/Branches for all areas in CPB."
  class: narrative
  expected_behavior: narrative
  tier: genie
  expected_tools: [genie]
  answered_by: live_agent
  tester_judgment: null
  truth_facts:
    - name: CBP Officers (series 1895) who reach retirement eligibility within the horizon the answer states, an approximation from age bracket and years of service under the enhanced law-enforcement rule (age 50 with 20 years, or 25 years at any age), brackets counted from their lower bound
      tolerance: pct:10
      readings:
        - name: within two years
          truth_sql: |
            SELECT count(*) FILTER (WHERE (a + 2 >= 50 AND length_of_service_years + 2 >= 20) OR length_of_service_years + 2 >= 25) FROM (SELECT substring(age_bracket from '^([0-9]+)')::int AS a, length_of_service_years FROM workforce.synthetic.employment WHERE snapshot_month = DATE'2026-08-01' AND agency_subelement_code = 'HSBD' AND occupational_series_code = '1895')
        - name: within three years
          truth_sql: |
            SELECT count(*) FILTER (WHERE (a + 3 >= 50 AND length_of_service_years + 3 >= 20) OR length_of_service_years + 3 >= 25) FROM (SELECT substring(age_bracket from '^([0-9]+)')::int AS a, length_of_service_years FROM workforce.synthetic.employment WHERE snapshot_month = DATE'2026-08-01' AND agency_subelement_code = 'HSBD' AND occupational_series_code = '1895')
        - name: within five years
          truth_sql: |
            SELECT count(*) FILTER (WHERE (a + 5 >= 50 AND length_of_service_years + 5 >= 20) OR length_of_service_years + 5 >= 25) FROM (SELECT substring(age_bracket from '^([0-9]+)')::int AS a, length_of_service_years FROM workforce.synthetic.employment WHERE snapshot_month = DATE'2026-08-01' AND agency_subelement_code = 'HSBD' AND occupational_series_code = '1895')
  must_not_claim:
    - that eligibility cannot be computed because the data has no age (age_bracket and length_of_service_years are on the records)
    - that the data holds an organizational hierarchy below component and occupation (Groups, Divisions, Branches), or any figure at that level
  notes: Relabelled 2026-11-03. On 2026-11-01 the agent answered Not available on a false limit (no age); the hierarchy limit is real and a good answer states it while giving the approximate eligibility by occupation. The 1895 row is the graded fact because its retirement rule is published; other occupations are not graded.

- id: A02
  author: tester_a
  session_log: challenge/eval/sessions/2026-11-01-tester-a/trace.jsonl
  verbatim: Just need CPB occupations but now that you asked, it might be useful to know how CBP compares to other components.
  class: follow_up
  expected_behavior: narrative
  tier: genie
  expected_tools: [genie]
  answered_by: live_agent
  tester_judgment: right
  prior_turns:
    - "As the Human Capital analyst I need more data on retirement eligibility numbers for next several years and would like it broken down by occupation. Would also like it to be systemtically aligned to the hiring pipeline by occupation and organization hierarchy (Groups/Divisions/Branches for all areas in CPB."
  truth_facts:
    - name: CBP headcount on the August 2026 snapshot
      tolerance: pct:1
      truth_sql: |
        SELECT count(*) FROM workforce.synthetic.employment WHERE snapshot_month = DATE'2026-08-01' AND agency_subelement_code = 'HSBD'
    - name: CBP's rank among the DHS components on the long-service share the answer compares (1 is the highest share)
      tolerance: abs:1
      readings:
        - name: share of staff with 20 or more years of service
          truth_sql: |
            SELECT r FROM (SELECT agency_subelement_code AS c, rank() OVER (ORDER BY (count(*) FILTER (WHERE length_of_service_years >= 20))::numeric / count(*) DESC) AS r FROM workforce.synthetic.employment WHERE snapshot_month = DATE'2026-08-01' GROUP BY 1) x WHERE c = 'HSBD'
        - name: share of staff with 10 or more years of service
          truth_sql: |
            SELECT r FROM (SELECT agency_subelement_code AS c, rank() OVER (ORDER BY (count(*) FILTER (WHERE length_of_service_years >= 10))::numeric / count(*) DESC) AS r FROM workforce.synthetic.employment WHERE snapshot_month = DATE'2026-08-01' GROUP BY 1) x WHERE c = 'HSBD'
  must_not_claim:
    - that CBP is second only to ICE, or second among the components, on the 20-year share (it is fifth of twelve)
  notes: The answer the tester called "great data" on 2026-11-01 ranked CBP second only to ICE on the 20-year share; the data ranks it fifth of twelve. The 2026-11-01 agent compared only the six components then in its codes skill.

- id: A03
  author: tester_a
  session_log: challenge/eval/sessions/2026-11-01-tester-a/trace.jsonl
  verbatim: Draft the OPM paragraph.
  class: narrative
  expected_behavior: narrative
  tier: verified
  expected_tools: [plan_variance]
  answered_by: live_agent
  tester_judgment: null
  truth_facts:
    - name: CBP Officer planned hires in FY2026 Q1
      tolerance: exact
      truth_sql: |
        WITH p AS (SELECT planned_hires, quarter_start FROM workforce.synthetic.staffing_plan WHERE fiscal_quarter = 'FY2026Q1' AND agency_subelement_code = 'HSBD' AND occupational_series_code = '1895') SELECT planned_hires FROM p
    - name: CBP Officer accessions in FY2026 Q1 (October to December 2025)
      tolerance: exact
      truth_sql: |
        WITH p AS (SELECT planned_hires, quarter_start FROM workforce.synthetic.staffing_plan WHERE fiscal_quarter = 'FY2026Q1' AND agency_subelement_code = 'HSBD' AND occupational_series_code = '1895') SELECT count(*) FROM workforce.synthetic.accessions x JOIN p ON date_trunc('quarter', x.effective_month)::date = p.quarter_start WHERE x.agency_subelement_code = 'HSBD' AND x.occupational_series_code = '1895'
    - name: FY2026 Q1 variance, actual minus planned
      tolerance: exact
      truth_sql: |
        WITH p AS (SELECT planned_hires, quarter_start FROM workforce.synthetic.staffing_plan WHERE fiscal_quarter = 'FY2026Q1' AND agency_subelement_code = 'HSBD' AND occupational_series_code = '1895'), a AS (SELECT count(*) FROM workforce.synthetic.accessions x JOIN p ON date_trunc('quarter', x.effective_month)::date = p.quarter_start WHERE x.agency_subelement_code = 'HSBD' AND x.occupational_series_code = '1895') SELECT (SELECT count FROM a) - p.planned_hires FROM p
  must_not_claim:
    - any named individual
    - that the data shows why the quarter missed plan
  notes: The review is open on the CBP Officer FY2026 Q1 cell (scope skill), so "the OPM paragraph" is that cell's. The paragraph skill (05) was written for this ask, so the row measures the skill as much as the prompt; disclosed above.

