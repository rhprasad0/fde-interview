# Golden questions for the workforce variance-review agent. Spec 04.
# Two kinds of author. Tester rows keep their session-log q_id (A01...) and their verbatim text.
# Co-written rows (C01...) were drafted by Ryan and Claude together on 2026-11-02, each from a
# seed (a tester question or a public source), and approved row by row by Ryan before entry.
# No question comes from a simulated user. Amended 2026-11-02; see DECISIONS.md, Evaluation.
# Truth (truth_sql, truth_value, truth_computed_at, the two requires_* flags) is authored in
# spec 04 step 3 and is null until then. Tester rows are added once the session log is filled.
# Schema and rules: challenge/specs/04-eval-set.md, step 4.
set_version: eval-v1
opm_through: 2026-08-01
usajobs_pulled: 2026-10-31
frozen: true  # tagged eval-v1 on 2026-11-03: the 20 rows the prompt was tuned against; held-out tester rows added after the tag
sources:
  tester_a: former federal HR professional, current contractor in an unrelated field, not a Palantir user; session 2026-11-01. Rows A01 to A08 are verbatim from challenge/eval/sessions/2026-11-01-tester-a/trace.jsonl, added 2026-11-03 after the eval-v1 tag as the held-out line; expected behaviour relabelled from what the data supports, not from the 2026-11-01 answers
  ryan_claude: co-written by Ryan and Claude from a cited seed, approved by Ryan row by row on 2026-11-02, before any eval run
  ryan: domain-literate analyst; rows written after classification, before any run
seeds:
  tsa_testimony: https://www.tsa.gov/news/press/testimony/2026/03/25/oversight-hearing-dhs-shutdown-impacts
  gao_fema: https://www.gao.gov/products/gao-26-108427
  gao_cbp: https://www.gao.gov/products/gao-24-107029
  opm_fwd_changes: https://data.opm.gov/explore-data/analytics/workforce-changes
  opm_workforce_analysis: https://www.opm.gov/agency-services/talent-management-services/strategic-consulting/workforce-and-succession-planning/workforce-consulting-and-analysis/
  task_4: session plan, Task 4 (decide on the recommended cells)
  task_5: session plan, Task 5 (try to break it), never run
  spec_04_lapse_case: challenge/specs/04-eval-set.md step 3, the pinned FY2026 Q1 lapse recompute
  # Transcript timestamps are written tester_MM_SS (tester_16_51 is 16:51 in the session transcript).
questions:

# ---- Verified tier (5) ----

- id: C01
  author: ryan_claude
  seed: [A01, A02]
  reason: coverage
  verbatim: What share of CBP Officers have 20 or more years of service?
  class: family_4
  expected_behavior: number
  tier: verified
  expected_tools: [length_of_service_profile]
  tolerance: abs:0.001
  truth_sql: |
    SELECT round((count(*) FILTER (WHERE length_of_service_years >= 20))::numeric / count(*), 4) FROM workforce.synthetic.employment WHERE snapshot_month = DATE'2026-08-01' AND agency_subelement_code = 'HSBD' AND occupational_series_code = '1895'
  notes: Retirement exposure, the nearest answerable view of the tester's eligibility question.

- id: C02
  author: ryan_claude
  seed: [A03, task_4]
  reason: coverage
  verbatim: Which components missed their hiring plan by the most in the first quarter of FY2026?
  class: family_7
  expected_behavior: list
  tier: verified
  expected_tools: [plan_variance]
  tolerance: exact
  truth_sql: |
    WITH p AS (SELECT agency_subelement_code AS c, occupational_series_code AS s, quarter_start, planned_hires
    FROM workforce.synthetic.staffing_plan WHERE fiscal_quarter IN ('FY2026Q1')),
    a AS (SELECT p.c, count(*) AS n FROM workforce.synthetic.accessions x JOIN p ON x.agency_subelement_code = p.c
    AND x.occupational_series_code = p.s AND date_trunc('quarter', x.effective_month)::date = p.quarter_start GROUP BY p.c),
    pp AS (SELECT c, sum(planned_hires) AS planned FROM p GROUP BY c)
    SELECT pp.c AS key, coalesce(a.n, 0) - pp.planned AS value, row_number() OVER (ORDER BY coalesce(a.n, 0) - pp.planned, pp.c) AS rank
    FROM pp LEFT JOIN a USING (c) WHERE coalesce(a.n, 0) - pp.planned < 0 ORDER BY 2
  key_by: component
  notes: Ranked by variance, components that missed plan only (corrected 2026-11-02 in the hill-climbing journal; the first truth ranked all twelve); the plan is synthetic, so requires_synthetic_label is true (scored per page, spec 06).

- id: C03
  author: ryan_claude
  seed: [A08, gao_fema]
  reason: coverage
  verbatim: Give me two sentences on FEMA hiring this year that I can read to the Director.
  class: narrative
  expected_behavior: narrative
  tier: verified
  expected_tools: [plan_variance]
  truth_facts:
    - name: FEMA hiring variance against plan in FY2026
      tolerance: abs:1
      readings:  # "this year" read either way is acceptable (Ryan, 2026-11-02); the answer must say which period
        - name: to date, Q1 to Q4 with accessions through August 2026
          truth_sql: |
            WITH p AS (SELECT occupational_series_code AS s, quarter_start, planned_hires FROM workforce.synthetic.staffing_plan
              WHERE fiscal_quarter IN ('FY2026Q1', 'FY2026Q2', 'FY2026Q3', 'FY2026Q4') AND agency_subelement_code = 'HSCB'),
            a AS (SELECT count(*) AS n FROM workforce.synthetic.accessions x JOIN p ON x.agency_subelement_code = 'HSCB'
              AND x.occupational_series_code = p.s AND date_trunc('quarter', x.effective_month)::date = p.quarter_start)
            SELECT a.n - (SELECT sum(planned_hires) FROM p) FROM a
        - name: complete quarters, Q1 to Q3 through June 2026
          truth_sql: |
            WITH p AS (SELECT occupational_series_code AS s, quarter_start, planned_hires FROM workforce.synthetic.staffing_plan
              WHERE fiscal_quarter IN ('FY2026Q1', 'FY2026Q2', 'FY2026Q3') AND agency_subelement_code = 'HSCB'),
            a AS (SELECT count(*) AS n FROM workforce.synthetic.accessions x JOIN p ON x.agency_subelement_code = 'HSCB'
              AND x.occupational_series_code = p.s AND date_trunc('quarter', x.effective_month)::date = p.quarter_start)
            SELECT a.n - (SELECT sum(planned_hires) FROM p) FROM a
  must_not_claim:
    - that the data shows why FEMA hiring paused (the hiring freeze is public context, not a data finding)
    - any named individual
  notes: Unverified that FEMA has plan cells in every FY2026 quarter; check in step 3 or swap the tool.

- id: C04
  author: ryan_claude
  seed: [spec_04_lapse_case, A08]
  reason: coverage
  verbatim: Redo that with the shutdown taken out.
  class: context_supplied
  expected_behavior: number
  tier: verified
  expected_tools: [plan_variance]
  turn_1: How did CBP Officer hiring do against plan in the first quarter of FY2026?
  supplied_context: The government was shut down from October 1 to November 12, 2025.
  turn_2: Redo that with the shutdown taken out.
  assumption_text: scaled to the days hiring was possible
  tolerance: abs:1
  truth_sql: |
    WITH p AS (SELECT planned_hires, quarter_start FROM workforce.synthetic.staffing_plan WHERE fiscal_quarter = 'FY2026Q1' AND agency_subelement_code = 'HSBD' AND occupational_series_code = '1895'),
    a AS (SELECT count(*) AS n FROM workforce.synthetic.accessions x JOIN p ON date_trunc('quarter', x.effective_month)::date = p.quarter_start
    WHERE x.agency_subelement_code = 'HSBD' AND x.occupational_series_code = '1895')
    SELECT round((a.n - p.planned_hires * 49.0 / 92)::numeric, 1) FROM p CROSS JOIN a
  notes: Pinned convention (spec 04 step 3) scales the plan of 594 to about 316 over 49 of 92 days; actuals of 475 are not adjusted.

- id: C05
  author: ryan_claude
  seed: [tsa_testimony, opm_fwd_changes]
  reason: coverage
  verbatim: Now leave out the people who took deferred resignation.
  class: follow_up
  expected_behavior: number
  tier: verified
  expected_tools: [separation_rate]
  prior_turns:
    - What was the attrition rate for TSA screeners over the last twelve months?
  tolerance: abs:0.001
  truth_sql: |
    WITH hc AS (SELECT count(*) FILTER (WHERE snapshot_month = DATE'2025-09-01') AS s, count(*) FILTER (WHERE snapshot_month = DATE'2026-08-01') AS e
    FROM workforce.synthetic.employment WHERE snapshot_month IN (DATE'2025-09-01', DATE'2026-08-01') AND agency_subelement_code = 'HSBC' AND occupational_series_code = '1802'),
    sp AS (SELECT count(*) FILTER (WHERE drp_indicator <> 'Y') AS x FROM workforce.synthetic.separations WHERE effective_month BETWEEN DATE'2025-09-01' AND DATE'2026-08-01' AND agency_subelement_code = 'HSBC' AND occupational_series_code = '1802')
    SELECT round(sp.x::numeric / ((hc.s + hc.e) / 2.0), 4) FROM hc CROSS JOIN sp
  notes: Tester did not know the deferred resignation program (10:44). Graded on the second answer; the rate must come from a call in this run.

