# Default gitleaks rules, plus one narrow allowlist. Read by the pre-commit hook and the CI action.
[extend]
useDefault = true

[[allowlists]]
description = "Eval answer keys such as \"quits_oct_nov_2025\" match generic-api-key; only identifiers that start with a lowercase word and join parts with underscores are allowed, in the eval results file only, so a hex or mixed-case token still trips the rule"
targetRules = ["generic-api-key"]
condition = "AND"  # path AND pattern; the default OR would allow the whole file
paths = ['''challenge/eval/experiments\.jsonl$''']
regexTarget = "match"
regexes = ['''key": "[a-z]+(_[A-Za-z0-9-]+)+"''', '''^[a-z]+(_[A-Za-z0-9-]+)+", "[a-z]+(_[A-Za-z0-9-]+)+"$''']  # second: two adjacent SQL column names such as "accessions_...", "planned_hires_fy2026"
